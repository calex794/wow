[package]
name = "wow-cloud-s3-lab"
version = "0.1.0"
edition = "2021"
publish = false

# Deliberately a standalone laboratory crate: the main WOW build, QUIC,
# W3/W4, K-credit journal, and Akula Sync do NOT depend on AWS SDK.
[dependencies]
akula-wire-lab = { path = "../.." }
aws-sdk-s3 = "=1.119.0"
tokio = { version = "1.48", features = ["rt-multi-thread", "time"] }
blake3 = "1.5"
getrandom = "0.4"
hpke = "0.14.1"
ed25519-dalek = "2.2"

[dev-dependencies]
tempfile = "3.12"
