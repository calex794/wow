name: rust-wire-lab
on:
  push:
    branches: [main]
  pull_request:

# A feature branch with a PR runs once, not both on push and pull_request.
# Superseded PR commits do not need to consume runner capacity.
concurrency:
  group: wow-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings

  w6_iroh_quic:
    name: W6 authenticated iroh QUIC (loopback)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve and prove exact Roha/noq Git fork chain
        run: |
          cargo metadata --features iroh-transport --format-version 1 > metadata.json
          python3 scripts/check_dependency_chain.py metadata.json Cargo.lock
          cargo tree --features iroh-transport -i noq
          cargo tree --features iroh-transport -i noq-proto
          cargo tree --features iroh-transport -i noq-udp
      - name: Run authenticated iroh QUIC loopback integration tests
        run: cargo test --features iroh-transport --all-targets
      - name: Strict Clippy including real iroh adapter
        run: cargo clippy --features iroh-transport --all-targets -- -D warnings

  w4_recipient_enospc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Mount isolated 16 MiB Linux tmpfs
        run: |
          ROOT="$RUNNER_TEMP/staya-w4-enospc"
          mkdir -p "$ROOT"
          sudo mount -t tmpfs -o size=16m,mode=0777,nosuid,nodev tmpfs "$ROOT"
          mountpoint -q "$ROOT"
          test "$(stat -c %d "$ROOT")" != "$(stat -c %d "$RUNNER_TEMP")"
      - name: Assert real ENOSPC cannot yield recipient ACK
        env:
          STAYA_W4_ENOSPC_MOUNT: ${{ runner.temp }}/staya-w4-enospc
        run: cargo test --test recipient_enospc_w4 -- --ignored --nocapture
      - name: Unmount isolated test filesystem
        if: always()
        run: |
          ROOT="$RUNNER_TEMP/staya-w4-enospc"
          if mountpoint -q "$ROOT"; then sudo umount "$ROOT"; fi

  w5_mailbox_enospc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Mount isolated 16 MiB Linux tmpfs for W5
        run: |
          ROOT="$RUNNER_TEMP/staya-w5-enospc"
          mkdir -p "$ROOT"
          sudo mount -t tmpfs -o size=16m,mode=0777,nosuid,nodev tmpfs "$ROOT"
          mountpoint -q "$ROOT"
          test "$(stat -c %d "$ROOT")" != "$(stat -c %d "$RUNNER_TEMP")"
      - name: Assert OS ENOSPC pauses mailbox and restart requires recovery
        env:
          STAYA_ENOSPC_MOUNT: ${{ runner.temp }}/staya-w5-enospc
        run: cargo test --test mailbox_real_enospc_w5 -- --ignored --nocapture
      - name: Unmount isolated W5 filesystem
        if: always()
        run: |
          ROOT="$RUNNER_TEMP/staya-w5-enospc"
          if mountpoint -q "$ROOT"; then sudo umount "$ROOT"; fi
