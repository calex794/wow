name: NOQ combined 1000-path abandonment soak

on:
  push:
    branches:
      - "audit/noq-forks-17parts-*"
    paths:
      - ".github/workflows/noq-combined-path-soak.yml"
      - "research/noq-forks/tests/multipath_1000_unseen_path_churn_injected.rs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulated-path-churn:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NOQ_SHA: "538346e8fb300598991de560566289121e9528e9"
      RUST_LOG: "warn"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Exact integration revision and independent research fixture
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/calex794/noq.git pinned-noq
          git -C pinned-noq checkout --detach "$NOQ_SHA"
          test "$(git -C pinned-noq rev-parse HEAD)" = "$NOQ_SHA"
          cat research/noq-forks/tests/multipath_1000_unseen_path_churn_injected.rs >> pinned-noq/noq-proto/src/tests/multipath.rs
          git -C pinned-noq diff --check
          grep -q 'fork_audit_1000_unseen_paths_are_reclaimed' pinned-noq/noq-proto/src/tests/multipath.rs
      - name: 1000 fresh QUIC connections each with one locally abandoned unknown peer path
        working-directory: pinned-noq
        run: |
          set -euo pipefail
          cargo test --locked -p noq-proto --lib fork_audit_1000_unseen_paths_are_reclaimed
      - name: Write precise acceptance scope
        run: |
          printf '%s\n'             "Research-only 1000-cycle simulated unknown-peer abandonment succeeded for combined noq $NOQ_SHA."             "Checks path-count baseline, Discarded events and invalidated path_status each trial."             "Does not measure RSS, real sockets, Windows/Android, or Akula end-to-end transfers."             >> "$GITHUB_STEP_SUMMARY"
