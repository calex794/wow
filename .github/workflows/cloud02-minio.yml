name: WOW CLOUD-02 standalone MinIO laboratory
on:
  pull_request:
    paths:
      - 'labs/cloud_s3/**'
      - '.github/workflows/cloud02-minio.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: wow-cloud02-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  minio:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_MAX_ATTEMPTS: '1'
      WOW_MINIO_ENDPOINT: http://127.0.0.1:9000
      WOW_MINIO_BUCKET: wow-mail-lab
      WOW_MINIO_ACCESS: wow_ci_test_user
      WOW_MINIO_SECRET: wow_disposable_ci_only_20261023
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile isolated S3 lab and tests
        run: |
          set -euo pipefail
          cargo test --manifest-path labs/cloud_s3/Cargo.toml --all-targets --no-run
          cargo clippy --manifest-path labs/cloud_s3/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path labs/cloud_s3/Cargo.toml --lib
      - name: Start disposable single-node MinIO
        run: |
          set -euo pipefail
          docker run -d --rm --name wow-cloud02-minio \
            -p 127.0.0.1:9000:9000 \
            --tmpfs /data:rw,uid=65532,gid=65532,mode=0700 \
            -e MINIO_ROOT_USER="$WOW_MINIO_ACCESS" \
            -e MINIO_ROOT_PASSWORD="$WOW_MINIO_SECRET" \
            cgr.dev/chainguard/minio:latest server /data
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Prepare disposable versioned bucket via AWS CLI
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check 'awscli==1.42.70'
          export PATH="$HOME/.local/bin:$PATH"
          export AWS_ACCESS_KEY_ID="$WOW_MINIO_ACCESS"
          export AWS_SECRET_ACCESS_KEY="$WOW_MINIO_SECRET"
          aws --endpoint-url "$WOW_MINIO_ENDPOINT" s3api create-bucket --bucket "$WOW_MINIO_BUCKET"
          aws --endpoint-url "$WOW_MINIO_ENDPOINT" s3api put-bucket-versioning \
            --bucket "$WOW_MINIO_BUCKET" --versioning-configuration Status=Enabled
          status="$(aws --endpoint-url "$WOW_MINIO_ENDPOINT" s3api get-bucket-versioning \
            --bucket "$WOW_MINIO_BUCKET" --query Status --output text)"
          test "$status" = Enabled
      - name: Download pinned MinIO admin client
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            --output "$RUNNER_TEMP/mc" \
            https://github.com/minio/mc/releases/download/RELEASE.2025-08-13T08-35-41Z/mc.linux-amd64.RELEASE.2025-08-13T08-35-41Z
          printf '%s  %s\n' \
            '01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891' \
            "$RUNNER_TEMP/mc" | sha256sum --check -
          chmod 0700 "$RUNNER_TEMP/mc"
      - name: Provision independent mail principals
        run: |
          set -euo pipefail
          mc="$RUNNER_TEMP/mc"
          export MC_HOST_lab="http://${WOW_MINIO_ACCESS}:${WOW_MINIO_SECRET}@127.0.0.1:9000"
          "$mc" admin user add lab wow_alice_ci wow_alice_disposable_pass_20261023
          "$mc" admin user add lab wow_bob_ci wow_bob_disposable_pass_20261023
          for policy in alice bob; do
            "$mc" admin policy create lab "wow-${policy}-ci" \
              "$GITHUB_WORKSPACE/labs/cloud_s3/ci/${policy}-policy.json"
            "$mc" admin policy attach lab "wow-${policy}-ci" --user "wow_${policy}_ci"
          done
      - name: Test scoped account permissions on real MinIO
        env:
          WOW_ALICE_ACCESS: wow_alice_ci
          WOW_ALICE_SECRET: wow_alice_disposable_pass_20261023
          WOW_BOB_ACCESS: wow_bob_ci
          WOW_BOB_SECRET: wow_bob_disposable_pass_20261023
        run: |
          set -euo pipefail
          cargo test --manifest-path labs/cloud_s3/Cargo.toml \
            --test cloud05_scoped_accounts -- --ignored --nocapture --test-threads=1
      - name: Drop real successful MinIO PUT response at TCP proxy
        run: |
          set -euo pipefail
          python3 labs/cloud_s3/ci/lost_put_ack_proxy.py &
          proxy_pid=$!
          echo "WOW_CLOUD_PROXY_PID=$proxy_pid" >> "$GITHUB_ENV"
          for i in $(seq 1 20); do
            if (echo > /dev/tcp/127.0.0.1/9001) 2>/dev/null; then break; fi
            sleep 0.2
          done
          cargo test --manifest-path labs/cloud_s3/Cargo.toml \
            --test cloud05_lost_ack -- --ignored --nocapture --test-threads=1
      - name: Stop network fault proxy
        if: always()
        run: |
          if [[ -n "${WOW_CLOUD_PROXY_PID:-}" ]]; then
            kill "$WOW_CLOUD_PROXY_PID" 2>/dev/null || true
          fi
      - name: CLOUD-06 isolated Alice and Bob Docker workers
        env:
          WOW_ALICE_ACCESS: wow_alice_ci
          WOW_ALICE_SECRET: wow_alice_disposable_pass_20261023
          WOW_BOB_ACCESS: wow_bob_ci
          WOW_BOB_SECRET: wow_bob_disposable_pass_20261023
        run: |
          set -euo pipefail
          cargo build --manifest-path labs/cloud_s3/Cargo.toml --bin cloud06_node
          bash labs/cloud_s3/ci/cloud06_isolated_containers.sh
      - name: CLOUD-07 authenticated W3/W4 isolated crash recovery
        env:
          WOW_ALICE_ACCESS: wow_alice_ci
          WOW_ALICE_SECRET: wow_alice_disposable_pass_20261023
          WOW_BOB_ACCESS: wow_bob_ci
          WOW_BOB_SECRET: wow_bob_disposable_pass_20261023
        run: |
          set -euo pipefail
          cargo build --manifest-path labs/cloud_s3/Cargo.toml --bin cloud07_actor
          bash labs/cloud_s3/ci/cloud07_crash_recovery.sh
      - name: CLOUD-07 audit single W4 revision after lost ACK
        run: |
          set -euo pipefail
          cargo test --manifest-path labs/cloud_s3/Cargo.toml \
            --test cloud07_version_audit -- --ignored --nocapture --test-threads=1
      - name: Execute real conditional PUT and exact-version GET
        run: |
          set -euo pipefail
          cargo test --manifest-path labs/cloud_s3/Cargo.toml \
            --test minio_offline -- --ignored --nocapture --test-threads=1
          cargo test --manifest-path labs/cloud_s3/Cargo.toml \
            --test cloud_w3_w4_e2e -- --ignored --nocapture --test-threads=1
          cargo test --manifest-path labs/cloud_s3/Cargo.toml \
            --test cloud04_reverse_w4 -- --ignored --nocapture --test-threads=1
      - name: Stop isolated MinIO
        if: always()
        run: |
          docker logs wow-cloud02-minio --tail 50 2>/dev/null || true
          docker stop wow-cloud02-minio >/dev/null 2>&1 || true
