name: Roha combined noq — Android native build gate

on:
  push:
    branches:
      - "audit/noq-forks-17parts-*"
    paths:
      - ".github/workflows/roha-combined-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android build ${{ matrix.target }} — pinned Roha
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - x86_64-linux-android
    env:
      ROHA_SHA: "554d5202b63e32b8a79156f7da2807d0f4859e4b"
      NOQ_SHA: "538346e8fb300598991de560566289121e9528e9"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.91"
          targets: ${{ matrix.target }}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
        id: ndk
        with:
          ndk-version: r25c
          add-to-path: true
      - name: Install pinned cargo-ndk helper
        run: |
          set -euo pipefail
          cargo install --locked --version 4.1.2 cargo-ndk
      - name: Checkout exact Roha SHA, with combined three-crate source
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/calex794/roha.git roha
          git -C roha checkout --detach "$ROHA_SHA"
          test "$(git -C roha rev-parse HEAD)" = "$ROHA_SHA"
          test "$(grep -F -c "$NOQ_SHA" roha/Cargo.toml)" -eq 3
          test -z "$(git -C roha status --porcelain)"
          echo "Android target $TARGET, pinned Roha $ROHA_SHA, pinned noq $NOQ_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Compile pinned iroh with Android NDK
        env:
          TARGET: ${{ matrix.target }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        working-directory: roha
        run: |
          set -euo pipefail
          cargo ndk --target "$TARGET" build --locked -p iroh
          git diff --exit-code -- Cargo.lock
          test -z "$(git status --porcelain)"
      - name: Define evidence limits
        env:
          TARGET: ${{ matrix.target }}
        run: |
          echo "PASS Android NDK native cross-build of Roha $ROHA_SHA + noq $NOQ_SHA for $TARGET." >> "$GITHUB_STEP_SUMMARY"
          echo "Compilation only: no Android emulator runtime, handset QUIC migration or Akula app integration." >> "$GITHUB_STEP_SUMMARY"
