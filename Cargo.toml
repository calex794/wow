[package]
name = "akula-wire-lab"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
name = "akula_wire_lab"
path = "src/lib.rs"

[features]
default = []
iroh-transport = ["dep:iroh", "dep:tokio"]

[dependencies]
# Project-pinned transport fork: same revisions as Akula/staya/roha-transport.
# The crate retains package version 1.3.0; source MUST be our Roha fork.
iroh = { git = "https://github.com/calex794/roha", rev = "396a6006b15e4c3a63e111a720b84416fe6220f1", default-features = false, features = ["tls-ring"], optional = true }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync", "time"], optional = true }
coset = "0.4.2"
ed25519-dalek = "2.2"
hpke = "0.14.1"
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1.5"
getrandom = "0.4"

[dev-dependencies]
tempfile = "3.12"

# Pin all three QUIC crates to ONE audited Git tree, never a mixed crates.io
# noq / noq-proto / noq-udp combination. Match Akula's transport lab manifest.
[patch.crates-io]
noq = { git = "https://github.com/calex794/noq", rev = "2eabf9895d40c263aa3369afd66efcf4a5d95056" }
noq-proto = { git = "https://github.com/calex794/noq", rev = "2eabf9895d40c263aa3369afd66efcf4a5d95056" }
noq-udp = { git = "https://github.com/calex794/noq", rev = "2eabf9895d40c263aa3369afd66efcf4a5d95056" }
