[package]
name = "wow-roha-preincoming-probe"
version = "0.0.0"
edition = "2021"
publish = false

# Run only after cloning the exact Roha Git revision next to the wow
# checkout and applying tools/w6_roha_preincoming_patch.py.
[dependencies]
iroh = { path = "../../../roha/iroh", default-features = false, features = ["tls-ring"] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "time"] }

[patch.crates-io]
noq = { git = "https://github.com/calex794/noq", rev = "2eabf9895d40c263aa3369afd66efcf4a5d95056" }
noq-proto = { git = "https://github.com/calex794/noq", rev = "2eabf9895d40c263aa3369afd66efcf4a5d95056" }
noq-udp = { git = "https://github.com/calex794/noq", rev = "2eabf9895d40c263aa3369afd66efcf4a5d95056" }
